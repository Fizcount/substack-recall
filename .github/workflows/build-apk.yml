name: Build Capacitor APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Bundle Tailwind, Generate Icons & Build APK
        run: |
          mkdir -p www
          if [ ! -f "www/index.html" ]; then
            FOUND_HTML=$(find . -maxdepth 3 -name "index.html" -not -path "./node_modules/*" -not -path "./android/*" | head -n 1)
            if [ -n "$FOUND_HTML" ]; then
              cp "$FOUND_HTML" www/index.html
            else
              echo "ERROR: File index.html tidak ditemukan di repositori!"
              exit 1
            fi
          fi

          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/local-notifications @capacitor/assets tailwindcss@3
          
          cat << 'EOF' > tailwind.config.js
          module.exports = {
            content: ["./www/**/*.html"],
            darkMode: 'class',
            theme: { extend: {} },
            plugins: [],
          }
          EOF
          printf "@tailwind base;\n@tailwind components;\n@tailwind utilities;\n" > input.css
          npx tailwindcss -i input.css -o www/tailwind.css --minify
          
          npx cap init "Substack Recall" "com.faiz.substackrecall" --web-dir=www
          npx cap add android
          
          # Generate icon dan splash dari icon.png tanpa menimpa dirinya sendiri
          ICON_FILE=$(find . -maxdepth 2 -name "icon.png" | head -n 1)
          if [ -n "$ICON_FILE" ]; then
            mkdir -p assets
            if [ "$ICON_FILE" != "./assets/icon.png" ] && [ "$ICON_FILE" != "assets/icon.png" ]; then
              cp "$ICON_FILE" assets/icon.png
            fi
            cp -f assets/icon.png assets/icon-only.png
            cp -f assets/icon.png assets/icon-foreground.png
            cp -f assets/icon.png assets/splash.png
            cp -f assets/icon.png assets/splash-dark.png
            npx capacitor-assets generate --android --iconBackgroundColor '#121110' --splashBackgroundColor '#121110' --splashBackgroundColorDark '#121110'
          fi
          
          # Tambahkan izin notifikasi, exact alarm, dan Android Share Target (ACTION_SEND)
          python3 -c '
          path = "android/app/src/main/AndroidManifest.xml"
          with open(path, "r") as f:
              xml = f.read()
          perms = """    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />"""
          xml = xml.replace("<application", perms + "\n    <application", 1)
          share_intent = """            <intent-filter>
                      <action android:name="android.intent.action.SEND" />
                      <category android:name="android.intent.category.DEFAULT" />
                      <data android:mimeType="text/plain" />
                  </intent-filter>"""
          xml = xml.replace("</activity>", share_intent + "\n        </activity>", 1)
          with open(path, "w") as f:
              f.write(xml)
          '
          
          # Tambahkan handler di MainActivity.java untuk meneruskan teks/link Share ke WebView
          MAIN_ACT=$(find android/app/src/main/java -name "MainActivity.java")
          python3 -c '
          import sys
          path = sys.argv[1]
          with open(path, "r") as f:
              code = f.read()
          imports = """import android.content.Intent;
          import android.os.Bundle;
          import org.json.JSONObject;
          """
          injection = """
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  handleShareIntent(getIntent());
              }

              @Override
              protected void onNewIntent(Intent intent) {
                  super.onNewIntent(intent);
                  setIntent(intent);
                  handleShareIntent(intent);
              }

              private void handleShareIntent(Intent intent) {
                  if (intent != null && Intent.ACTION_SEND.equals(intent.getAction()) && "text/plain".equals(intent.getType())) {
                      String sharedText = intent.getStringExtra(Intent.EXTRA_TEXT);
                      String sharedSubject = intent.getStringExtra(Intent.EXTRA_SUBJECT);
                      if (sharedText != null) {
                          try {
                              JSONObject payload = new JSONObject();
                              payload.put("text", sharedText);
                              payload.put("subject", sharedSubject != null ? sharedSubject : "");
                              final String js = "window.__PENDING_SHARE__ = " + payload.toString() + "; if(window.onAndroidShare) window.onAndroidShare(window.__PENDING_SHARE__);";
                              if (getBridge() != null && getBridge().getWebView() != null) {
                                  getBridge().getWebView().post(() -> getBridge().getWebView().evaluateJavascript(js, null));
                              }
                          } catch (Exception ignored) {}
                      }
                  }
              }
          """
          code = code.replace("import com.getcapacitor.BridgeActivity;", "import com.getcapacitor.BridgeActivity;\n" + imports)
          code = code.replace("public class MainActivity extends BridgeActivity {}", "public class MainActivity extends BridgeActivity {" + injection + "}")
          with open(path, "w") as f:
              f.write(code)
          ' "$MAIN_ACT"
          
          npx cap sync android
          cd android && chmod +x gradlew && ./gradlew assembleDebug
          
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/Substack-Recall.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Substack-Recall
          path: android/app/build/outputs/apk/debug/Substack-Recall.apk
